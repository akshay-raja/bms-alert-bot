<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS Group Alert Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --input-bg: #0f172a;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    header { margin-bottom: 24px; text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    p.sub { font-size: 0.85rem; color: var(--muted); }
    
    .tracker-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; margin-bottom: 16px; position: relative;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-weight: 700; font-size: 1.05rem; color: #38bdf8; }
    .btn-delete {
      background: transparent; color: #ef4444; border: 1px solid #ef4444;
      padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
    }
    .btn-delete:hover { background: #ef4444; color: white; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    input, textarea, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 0.85rem; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }

    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button.main-btn {
      flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: 0.2s;
    }
    .btn-save { background: var(--accent); color: white; }
    .btn-save:hover { background: var(--accent-hover); }
    .btn-add { background: #334155; color: white; }
    .btn-add:hover { background: #475569; }

    #status { margin-top: 16px; font-size: 0.85rem; padding: 10px; border-radius: 8px; display: none; text-align: center; }
    .status-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .status-error { background: rgba(225, 29, 72, 0.15); color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎟️ BMS Group Alert Hub</h1>
    <p class="sub">Add individual movie alerts for yourself and your friends.</p>
  </header>

  <div id="trackers-list"></div>

  <div class="actions">
    <button class="main-btn btn-add" onclick="addTrackerCard()">➕ Add Another Tracker</button>
    <button class="main-btn btn-save" onclick="saveAllTrackers()">💾 Save All Trackers</button>
  </div>

  <div id="status"></div>
</div>

<script>
  const CONFIG_API_URL = "https://api.npoint.io/803e335a91e27ade1511";
  let trackers = [];

  window.onload = loadData;

  function showStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.className = isError ? 'status-error' : 'status-success';
    el.innerText = msg;
    el.style.display = 'block';
  }

  async function loadData() {
    try {
      const res = await fetch(CONFIG_API_URL);
      if (res.ok) {
        const data = await res.json();
        trackers = data.trackers || data;
        if (!Array.isArray(trackers) || trackers.length === 0) {
          trackers = [{
            id: Date.now().toString(),
            user_name: "Akshay",
            movie_url: "https://in.bookmyshow.com/movies/chennai/vishwanath-and-sons/buytickets/ET00489815",
            theaters: ["PVR", "INOX", "Sathyam", "SPI", "Palazzo", "AGS", "Luxe"],
            ntfy_topic: "akshay-bms-alert-160826",
            days_ahead: 3
          }];
        }
        renderTrackers();
      }
    } catch (e) {
      showStatus('Failed to load active trackers.', true);
    }
  }

  function renderTrackers() {
    const container = document.getElementById('trackers-list');
    container.innerHTML = '';

    trackers.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'tracker-card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-title">Watcher #${index + 1}: ${escapeHtml(item.user_name || 'Friend')}</span>
          ${trackers.length > 1 ? `<button class="btn-delete" onclick="deleteTracker(${index})">Remove</button>` : ''}
        </div>
        <div class="form-group">
          <label>Your Name / Identifier</label>
          <input type="text" value="${escapeHtml(item.user_name || '')}" oninput="updateField(${index}, 'user_name', this.value)" placeholder="e.g. Akshay">
        </div>
        <div class="form-group">
          <label>BookMyShow Movie Base URL</label>
          <textarea rows="2" oninput="updateField(${index}, 'movie_url', this.value)" placeholder="https://in.bookmyshow.com/movies/...">${escapeHtml(item.movie_url || '')}</textarea>
        </div>
        <div class="form-group">
          <label>Preferred Theaters (comma-separated)</label>
          <input type="text" value="${escapeHtml((item.theaters || []).join(', '))}" oninput="updateTheaters(${index}, this.value)" placeholder="PVR, INOX, Sathyam">
        </div>
        <div class="form-group">
          <label>ntfy Notification Topic</label>
          <input type="text" value="${escapeHtml(item.ntfy_topic || '')}" oninput="updateField(${index}, 'ntfy_topic', this.value)" placeholder="e.g. akshay-bms-alert">
        </div>
        <div class="form-group">
          <label>Days Ahead to Scan</label>
          <select onchange="updateField(${index}, 'days_ahead', parseInt(this.value, 10))">
            <option value="0" ${item.days_ahead == 0 ? 'selected' : ''}>Today only</option>
            <option value="1" ${item.days_ahead == 1 ? 'selected' : ''}>Today + Tomorrow (2 days)</option>
            <option value="2" ${item.days_ahead == 2 ? 'selected' : ''}>Today + Next 2 days (3 days)</option>
            <option value="3" ${item.days_ahead == 3 ? 'selected' : ''}>Today + Next 3 days (4 days)</option>
            <option value="5" ${item.days_ahead == 5 ? 'selected' : ''}>Today + Next 5 days (6 days)</option>
          </select>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function updateField(index, field, value) {
    trackers[index][field] = value;
  }

  function updateTheaters(index, value) {
    trackers[index].theaters = value.split(',').map(s => s.trim()).filter(Boolean);
  }

  function addTrackerCard() {
    trackers.push({
      id: Date.now().toString(),
      user_name: `Friend ${trackers.length + 1}`,
      movie_url: "",
      theaters: ["PVR", "INOX", "Sathyam"],
      ntfy_topic: `bms-alert-${Math.floor(1000 + Math.random() * 9000)}`,
      days_ahead: 3
    });
    renderTrackers();
  }

  function deleteTracker(index) {
    trackers.splice(index, 1);
    renderTrackers();
  }

  async function saveAllTrackers() {
    showStatus('Saving all active trackers...');
    try {
      const res = await fetch(CONFIG_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ trackers })
      });

      if (res.ok) {
        showStatus(`✓ Saved ${trackers.length} tracker(s) successfully! Cloud scanner is now synced.`);
      } else {
        showStatus('Error saving configurations.', true);
      }
    } catch (err) {
      showStatus(`Network Error: ${err.message}`, true);
    }
  }

  function escapeHtml(text) {
    return text.replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
