<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS Private Alert Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --input-bg: #0f172a;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    .container { width: 100%; max-width: 500px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    p.sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; color: var(--text); }
    input, textarea, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 0.88rem; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    small { font-size: 0.72rem; color: var(--muted); display: block; margin-top: 3px; }
    
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    button {
      flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: 0.2s ease;
    }
    .btn-save { background: var(--accent); color: white; }
    .btn-save:hover { background: var(--accent-hover); }
    .btn-delete { background: #334155; color: #ef4444; border: 1px solid #ef4444; }
    .btn-delete:hover { background: #ef4444; color: white; }
    
    #status { margin-top: 16px; font-size: 0.85rem; padding: 10px; border-radius: 8px; display: none; text-align: center; }
    .status-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .status-error { background: rgba(225, 29, 72, 0.15); color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <h1>🎟️ BMS Alert Manager</h1>
  <p class="sub">Configure your personal movie alerts. Other users' settings are hidden.</p>

  <div class="form-group">
    <label>Your Personal Key / Secret Name</label>
    <input type="text" id="user_key" placeholder="e.g. akshay_vip, rahul_chennai" onchange="loadUserTracker()">
    <small>Unique identifier for your alert. Saved automatically on this device.</small>
  </div>

  <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">

  <div class="form-group">
    <label>BookMyShow Base Movie URL</label>
    <textarea id="movie_url" rows="2" placeholder="https://in.bookmyshow.com/movies/chennai/movie-name/buytickets/ET00000000"></textarea>
    <small>Paste URL without the date at the end.</small>
  </div>

  <div class="form-group">
    <label>Target Theaters (comma-separated)</label>
    <input type="text" id="theaters" placeholder="PVR, INOX, Sathyam, Palazzo, AGS">
  </div>

  <div class="form-group">
    <label>ntfy Notification Topic</label>
    <input type="text" id="ntfy_topic" placeholder="e.g. akshay-bms-alert">
    <small>Subscribe to this topic on your ntfy mobile app.</small>
  </div>

  <div class="form-group">
    <label>Days Ahead to Scan</label>
    <select id="days_ahead">
      <option value="0">Today only</option>
      <option value="1">Today + Tomorrow (2 days)</option>
      <option value="2">Today + Next 2 days (3 days)</option>
      <option value="3" selected>Today + Next 3 days (4 days)</option>
      <option value="5">Today + Next 5 days (6 days)</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn-save" onclick="saveUserTracker()">💾 Save My Alert</button>
    <button class="btn-delete" onclick="deleteUserTracker()">🗑️ Clear</button>
  </div>

  <div id="status"></div>
</div>

<script>
  const CONFIG_API_URL = "https://api.npoint.io/803e335a91e27ade1511";

  window.onload = () => {
    const savedKey = localStorage.getItem('bms_user_key') || '';
    if (savedKey) {
      document.getElementById('user_key').value = savedKey;
      loadUserTracker();
    }
  };

  function showStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.className = isError ? 'status-error' : 'status-success';
    el.innerText = msg;
    el.style.display = 'block';
  }

  async function fetchRemoteTrackers() {
    try {
      const res = await fetch(CONFIG_API_URL);
      if (res.ok) {
        const data = await res.json();
        return Array.isArray(data.trackers) ? data.trackers : (Array.isArray(data) ? data : []);
      }
    } catch (e) {
      console.error('Fetch error:', e);
    }
    return [];
  }

  async function loadUserTracker() {
    const userKey = document.getElementById('user_key').value.trim().toLowerCase();
    if (!userKey) return;
    localStorage.setItem('bms_user_key', userKey);

    const trackers = await fetchRemoteTrackers();
    const myTracker = trackers.find(t => (t.id || '').toLowerCase() === userKey);

    if (myTracker) {
      document.getElementById('movie_url').value = myTracker.movie_url || '';
      document.getElementById('theaters').value = (myTracker.theaters || []).join(', ');
      document.getElementById('ntfy_topic').value = myTracker.ntfy_topic || '';
      document.getElementById('days_ahead').value = myTracker.days_ahead ?? 3;
      showStatus(`Loaded active settings for '${userKey}'.`);
    } else {
      document.getElementById('movie_url').value = '';
      document.getElementById('theaters').value = '';
      document.getElementById('ntfy_topic').value = '';
      document.getElementById('days_ahead').value = 3;
      showStatus(`No saved alert found for '${userKey}'. Fill fields to create one.`);
    }
  }

  async function saveUserTracker() {
    const userKey = document.getElementById('user_key').value.trim().toLowerCase();
    const movie_url = document.getElementById('movie_url').value.trim();
    const theaters = document.getElementById('theaters').value.split(',').map(t => t.trim()).filter(Boolean);
    const ntfy_topic = document.getElementById('ntfy_topic').value.trim();
    const days_ahead = parseInt(document.getElementById('days_ahead').value, 10);

    if (!userKey || !movie_url || !theaters.length || !ntfy_topic) {
      showStatus('Please provide Your Key, Movie URL, Theaters, and ntfy Topic.', true);
      return;
    }

    localStorage.setItem('bms_user_key', userKey);
    showStatus('Syncing your alert...');

    try {
      let trackers = await fetchRemoteTrackers();
      const existingIndex = trackers.findIndex(t => (t.id || '').toLowerCase() === userKey);

      const userObject = {
        id: userKey,
        user_name: userKey,
        movie_url,
        theaters,
        ntfy_topic,
        days_ahead
      };

      if (existingIndex >= 0) {
        trackers[existingIndex] = userObject;
      } else {
        trackers.push(userObject);
      }

      const res = await fetch(CONFIG_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ trackers })
      });

      if (res.ok) {
        showStatus(`✓ Your alert for '${userKey}' is saved and active!`);
      } else {
        showStatus('Failed to update remote storage.', true);
      }
    } catch (err) {
      showStatus(`Network Error: ${err.message}`, true);
    }
  }

  async function deleteUserTracker() {
    const userKey = document.getElementById('user_key').value.trim().toLowerCase();
    if (!userKey) return;

    showStatus('Removing alert...');
    try {
      let trackers = await fetchRemoteTrackers();
      trackers = trackers.filter(t => (t.id || '').toLowerCase() !== userKey);

      const res = await fetch(CONFIG_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ trackers })
      });

      if (res.ok) {
        document.getElementById('movie_url').value = '';
        document.getElementById('theaters').value = '';
        document.getElementById('ntfy_topic').value = '';
        showStatus(`Alert '${userKey}' removed.`);
      }
    } catch (err) {
      showStatus(`Error removing: ${err.message}`, true);
    }
  }
</script>
</body>
</html>
