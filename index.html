<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS Alert Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --input-bg: #0f172a;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 540px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; color: var(--text); display: flex; align-items: center; gap: 8px; }
    p.sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    input, textarea, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 0.9rem; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    small { font-size: 0.75rem; color: var(--muted); display: block; margin-top: 4px; }
    .btn-group { display: flex; gap: 10px; margin-top: 24px; }
    button {
      flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: 0.2s ease;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: white; }
    .btn-secondary:hover { background: #475569; }
    #status { margin-top: 16px; font-size: 0.85rem; padding: 10px; border-radius: 8px; display: none; }
    .status-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .status-error { background: rgba(225, 29, 72, 0.15); color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <h1>🎟️ BMS Alert Configurator</h1>
  <p class="sub">Update target movies and theaters. The cloud bot auto-syncs.</p>

  <div class="form-group">
    <label>GitHub Repository (username/repo-name)</label>
    <input type="text" id="repo" placeholder="e.g. anubr/bms-alert-bot">
  </div>

  <div class="form-group">
    <label>GitHub Personal Access Token (PAT)</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <small>Requires <code>repo</code> or <code>contents:write</code> scope to commit changes.</small>
  </div>

  <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

  <div class="form-group">
    <label>BookMyShow Base Movie URL</label>
    <textarea id="movie_url" rows="2" placeholder="https://in.bookmyshow.com/movies/chennai/movie-name/buytickets/ET00000000"></textarea>
    <small>Do not include the date parameter at the end.</small>
  </div>

  <div class="form-group">
    <label>Target Theaters (comma-separated keywords)</label>
    <input type="text" id="theaters" placeholder="PVR, INOX, Sathyam, Palazzo, AGS">
  </div>

  <div class="form-group">
    <label>ntfy Topic</label>
    <input type="text" id="ntfy_topic" placeholder="akshay-bms-alert-160826">
  </div>

  <div class="form-group">
    <label>Days Ahead to Scan</label>
    <select id="days_ahead">
      <option value="0">Today only</option>
      <option value="1">Today + Tomorrow (2 days)</option>
      <option value="2">Today + Next 2 days (3 days)</option>
      <option value="3" selected>Today + Next 3 days (4 days)</option>
      <option value="5">Today + Next 5 days (6 days)</option>
    </select>
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="saveConfiguration()">💾 Save & Update</button>
    <button class="btn-secondary" onclick="triggerWorkflow()">⚡ Run Scan Now</button>
  </div>

  <div id="status"></div>
</div>

<script>
  // Load saved credentials from localStorage
  window.onload = () => {
    document.getElementById('repo').value = localStorage.getItem('bms_repo') || '';
    document.getElementById('token').value = localStorage.getItem('bms_token') || '';
    if (localStorage.getItem('bms_repo') && localStorage.getItem('bms_token')) {
      loadCurrentConfig();
    }
  };

  function showStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.className = isError ? 'status-error' : 'status-success';
    el.innerText = msg;
    el.style.display = 'block';
  }

  async function loadCurrentConfig() {
    const repo = document.getElementById('repo').value.trim();
    const token = document.getElementById('token').value.trim();
    if (!repo || !token) return;

    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/config.json`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        const jsonContent = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        document.getElementById('movie_url').value = jsonContent.movie_url || '';
        document.getElementById('theaters').value = (jsonContent.theaters || []).join(', ');
        document.getElementById('ntfy_topic').value = jsonContent.ntfy_topic || '';
        document.getElementById('days_ahead').value = jsonContent.days_ahead ?? 3;
      }
    } catch (e) {
      console.log('Failed to fetch existing config', e);
    }
  }

  async function saveConfiguration() {
    const repo = document.getElementById('repo').value.trim();
    const token = document.getElementById('token').value.trim();
    const movie_url = document.getElementById('movie_url').value.trim();
    const theaters = document.getElementById('theaters').value.split(',').map(t => t.trim()).filter(Boolean);
    const ntfy_topic = document.getElementById('ntfy_topic').value.trim();
    const days_ahead = parseInt(document.getElementById('days_ahead').value, 10);

    if (!repo || !token || !movie_url) {
      showStatus('Please fill in GitHub Repo, Token, and Movie URL.', true);
      return;
    }

    localStorage.setItem('bms_repo', repo);
    localStorage.setItem('bms_token', token);

    const configData = { movie_url, theaters, ntfy_topic, days_ahead };
    const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(configData, null, 2))));

    showStatus('Saving changes to GitHub...');

    try {
      // 1. Get existing file SHA
      let sha = null;
      const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/config.json`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (getRes.ok) {
        const fileData = await getRes.json();
        sha = fileData.sha;
      }

      // 2. Commit updated config.json
      const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/config.json`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Update BMS alert target config [via Web UI]',
          content: contentEncoded,
          sha: sha || undefined
        })
      });

      if (putRes.ok) {
        showStatus('✓ Configuration saved! GitHub Actions will scan this movie automatically.');
      } else {
        const err = await putRes.json();
        showStatus(`Error saving: ${err.message}`, true);
      }
    } catch (err) {
      showStatus(`Network Error: ${err.message}`, true);
    }
  }

  async function triggerWorkflow() {
    const repo = document.getElementById('repo').value.trim();
    const token = document.getElementById('token').value.trim();
    if (!repo || !token) {
      showStatus('GitHub Repo & Token are required to trigger runs.', true);
      return;
    }

    showStatus('Triggering scan on GitHub Actions...');
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/bms_check.yml/dispatches`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ ref: 'main' })
      });

      if (res.status === 204) {
        showStatus('✓ Scan triggered! Check the Actions tab or wait for ntfy alerts.');
      } else {
        const err = await res.json();
        showStatus(`Trigger failed: ${err.message}`, true);
      }
    } catch (err) {
      showStatus(`Network Error: ${err.message}`, true);
    }
  }
</script>
</body>
</html>
