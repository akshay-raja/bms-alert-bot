<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS Alert Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --input-bg: #0f172a;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    .container { width: 100%; max-width: 500px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    p.sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    input, textarea, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 0.9rem; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    small { font-size: 0.75rem; color: var(--muted); display: block; margin-top: 4px; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; transition: 0.2s ease; background: var(--accent); color: white; margin-top: 10px;
    }
    button:hover { background: var(--accent-hover); }
    #status { margin-top: 16px; font-size: 0.85rem; padding: 10px; border-radius: 8px; display: none; }
    .status-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .status-error { background: rgba(225, 29, 72, 0.15); color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <h1>🎟️ BMS Alert Manager</h1>
  <p class="sub">Update the target movie and theater keywords below. Scanners sync automatically.</p>

  <div class="form-group">
    <label>BookMyShow Base Movie URL</label>
    <textarea id="movie_url" rows="2" placeholder="https://in.bookmyshow.com/movies/chennai/movie-name/buytickets/ET00000000"></textarea>
    <small>Provide URL without the date at the end.</small>
  </div>

  <div class="form-group">
    <label>Target Theaters (comma-separated)</label>
    <input type="text" id="theaters" placeholder="PVR, INOX, Sathyam, Palazzo, AGS, Luxe">
  </div>

  <div class="form-group">
    <label>ntfy Notification Topic</label>
    <input type="text" id="ntfy_topic" placeholder="akshay-bms-alert-160826">
  </div>

  <div class="form-group">
    <label>Days Ahead to Scan</label>
    <select id="days_ahead">
      <option value="0">Today only</option>
      <option value="1">Today + Tomorrow (2 days)</option>
      <option value="2">Today + Next 2 days (3 days)</option>
      <option value="3" selected>Today + Next 3 days (4 days)</option>
      <option value="5">Today + Next 5 days (6 days)</option>
    </select>
  </div>

  <button onclick="saveConfiguration()">💾 Save & Update Scanner</button>
  <div id="status"></div>
</div>

<script>
  const CONFIG_API_URL = "https://api.npoint.io/803e335a91e27ade1511";

  window.onload = loadCurrentConfig;

  function showStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.className = isError ? 'status-error' : 'status-success';
    el.innerText = msg;
    el.style.display = 'block';
  }

  async function loadCurrentConfig() {
    try {
      const res = await fetch(CONFIG_API_URL);
      if (res.ok) {
        const data = await res.json();
        document.getElementById('movie_url').value = data.movie_url || '';
        document.getElementById('theaters').value = (data.theaters || []).join(', ');
        document.getElementById('ntfy_topic').value = data.ntfy_topic || '';
        document.getElementById('days_ahead').value = data.days_ahead ?? 3;
      }
    } catch (e) {
      showStatus('Failed to load current settings.', true);
    }
  }

  async function saveConfiguration() {
    const movie_url = document.getElementById('movie_url').value.trim();
    const theaters = document.getElementById('theaters').value.split(',').map(t => t.trim()).filter(Boolean);
    const ntfy_topic = document.getElementById('ntfy_topic').value.trim();
    const days_ahead = parseInt(document.getElementById('days_ahead').value, 10);

    if (!movie_url || !theaters.length || !ntfy_topic) {
      showStatus('Please fill in Movie URL, Theaters, and ntfy topic.', true);
      return;
    }

    const payload = { movie_url, theaters, ntfy_topic, days_ahead };
    showStatus('Saving changes...');

    try {
      const res = await fetch(CONFIG_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        showStatus('✓ Configuration saved! Cloud scanners are now synced.');
      } else {
        showStatus('Error saving configuration.', true);
      }
    } catch (err) {
      showStatus(`Network Error: ${err.message}`, true);
    }
  }
</script>
</body>
</html>
