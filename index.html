<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS Seat & Show Watcher</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --input-bg: #0f172a;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    p.sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; color: var(--text); }
    input, textarea, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 0.88rem; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    small { font-size: 0.72rem; color: var(--muted); display: block; margin-top: 3px; }
    
    .checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 6px; }
    .checkbox-item {
      display: flex; align-items: center; gap: 8px; background: var(--input-bg);
      border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
    }
    .checkbox-item input { width: auto; margin: 0; cursor: pointer; }

    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button {
      flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: 0.2s ease;
    }
    .btn-save { background: var(--accent); color: white; }
    .btn-save:hover { background: var(--accent-hover); }
    .btn-delete { background: #334155; color: #ef4444; border: 1px solid #ef4444; }
    .btn-delete:hover { background: #ef4444; color: white; }
    
    #status { margin-top: 16px; font-size: 0.85rem; padding: 10px; border-radius: 8px; display: none; text-align: center; }
    .status-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .status-error { background: rgba(225, 29, 72, 0.15); color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <h1>🎟️ BMS Granular Seat Watcher</h1>
  <p class="sub">Set up individual alerts for specific showtimes and seating zones.</p>

  <div class="form-group">
    <label>Your Personal Key / Secret Identifier</label>
    <input type="text" id="user_key" placeholder="e.g. akshay_pvr, rahul_omr" onchange="loadUserTracker()">
    <small>Only you can view and edit this configuration.</small>
  </div>

  <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">

  <div class="form-group">
    <label>BookMyShow Base Movie URL</label>
    <textarea id="movie_url" rows="2" placeholder="https://in.bookmyshow.com/movies/chennai/movie-name/buytickets/ET00000000"></textarea>
  </div>

  <div class="form-group">
    <label>Target Theaters (comma-separated)</label>
    <input type="text" id="theaters" placeholder="PVR, INOX, Sathyam, Palazzo, AGS">
  </div>

  <div class="form-group">
    <label>Show Availability Status</label>
    <select id="availability_filter">
      <option value="both" selected>Available (Green) + Filling Fast (Orange)</option>
      <option value="available">Available Only (Green)</option>
      <option value="filling_fast">Filling Fast Only (Orange)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Preferred Show Timings</label>
    <div class="checkbox-grid">
      <label class="checkbox-item"><input type="checkbox" name="pref_time" value="morning" checked> Morning (6AM - 12PM)</label>
      <label class="checkbox-item"><input type="checkbox" name="pref_time" value="afternoon" checked> Afternoon (12PM - 4PM)</label>
      <label class="checkbox-item"><input type="checkbox" name="pref_time" value="evening" checked> Evening (4PM - 8PM)</label>
      <label class="checkbox-item"><input type="checkbox" name="pref_time" value="night" checked> Night (8PM onwards)</label>
    </div>
  </div>

  <div class="form-group">
    <label>Preferred Seating Distance (Relative to Screen)</label>
    <div class="checkbox-grid">
      <label class="checkbox-item"><input type="checkbox" name="pref_row" value="near_screen"> Near Screen (First 20%)</label>
      <label class="checkbox-item"><input type="checkbox" name="pref_row" value="lower_middle"> Lower-Middle (Next 20%)</label>
      <label class="checkbox-item"><input type="checkbox" name="pref_row" value="upper_middle" checked> Upper-Middle (Next 30%)</label>
      <label class="checkbox-item"><input type="checkbox" name="pref_row" value="near_top" checked> Near Top (Top 30%)</label>
    </div>
  </div>

  <div class="form-group">
    <label>ntfy Notification Topic</label>
    <input type="text" id="ntfy_topic" placeholder="e.g. akshay-bms-alert-160826">
  </div>

  <div class="form-group">
    <label>Days Ahead to Scan</label>
    <select id="days_ahead">
      <option value="0">Today only</option>
      <option value="1">Today + Tomorrow (2 days)</option>
      <option value="2">Today + Next 2 days (3 days)</option>
      <option value="3" selected>Today + Next 3 days (4 days)</option>
      <option value="5">Today + Next 5 days (6 days)</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn-save" onclick="saveUserTracker()">💾 Save & Watch Seats</button>
    <button class="btn-delete" onclick="deleteUserTracker()">🗑️ Clear</button>
  </div>

  <div id="status"></div>
</div>

<script>
  const CONFIG_API_URL = "https://api.npoint.io/803e335a91e27ade1511";

  window.onload = () => {
    const savedKey = localStorage.getItem('bms_user_key') || '';
    if (savedKey) {
      document.getElementById('user_key').value = savedKey;
      loadUserTracker();
    }
  };

  function showStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.className = isError ? 'status-error' : 'status-success';
    el.innerText = msg;
    el.style.display = 'block';
  }

  async function fetchRemoteTrackers() {
    try {
      const res = await fetch(CONFIG_API_URL);
      if (res.ok) {
        const data = await res.json();
        return Array.isArray(data.trackers) ? data.trackers : (Array.isArray(data) ? data : []);
      }
    } catch (e) {
      console.error('Fetch error:', e);
    }
    return [];
  }

  async function loadUserTracker() {
    const userKey = document.getElementById('user_key').value.trim().toLowerCase();
    if (!userKey) return;
    localStorage.setItem('bms_user_key', userKey);

    const trackers = await fetchRemoteTrackers();
    const myTracker = trackers.find(t => (t.id || '').toLowerCase() === userKey);

    if (myTracker) {
      document.getElementById('movie_url').value = myTracker.movie_url || '';
      document.getElementById('theaters').value = (myTracker.theaters || []).join(', ');
      document.getElementById('ntfy_topic').value = myTracker.ntfy_topic || '';
      document.getElementById('days_ahead').value = myTracker.days_ahead ?? 3;
      document.getElementById('availability_filter').value = myTracker.availability_filter || 'both';

      const times = myTracker.preferred_times || ["morning", "afternoon", "evening", "night"];
      document.querySelectorAll('input[name="pref_time"]').forEach(cb => {
        cb.checked = times.includes(cb.value);
      });

      const rows = myTracker.preferred_rows || ["upper_middle", "near_top"];
      document.querySelectorAll('input[name="pref_row"]').forEach(cb => {
        cb.checked = rows.includes(cb.value);
      });

      showStatus(`Loaded alert settings for '${userKey}'.`);
    } else {
      document.getElementById('movie_url').value = '';
      document.getElementById('theaters').value = '';
      document.getElementById('ntfy_topic').value = '';
      showStatus(`No saved alert found for '${userKey}'. Enter details to create one.`);
    }
  }

  async function saveUserTracker() {
    const userKey = document.getElementById('user_key').value.trim().toLowerCase();
    const movie_url = document.getElementById('movie_url').value.trim();
    const theaters = document.getElementById('theaters').value.split(',').map(t => t.trim()).filter(Boolean);
    const ntfy_topic = document.getElementById('ntfy_topic').value.trim();
    const days_ahead = parseInt(document.getElementById('days_ahead').value, 10);
    const availability_filter = document.getElementById('availability_filter').value;

    const preferred_times = Array.from(document.querySelectorAll('input[name="pref_time"]:checked')).map(cb => cb.value);
    const preferred_rows = Array.from(document.querySelectorAll('input[name="pref_row"]:checked')).map(cb => cb.value);

    if (!userKey || !movie_url || !theaters.length || !ntfy_topic) {
      showStatus('Please fill in Your Key, Movie URL, Theaters, and ntfy topic.', true);
      return;
    }

    if (!preferred_times.length || !preferred_rows.length) {
      showStatus('Please select at least one show timing and row distance zone.', true);
      return;
    }

    localStorage.setItem('bms_user_key', userKey);
    showStatus('Saving target seats & show settings...');

    try {
      let trackers = await fetchRemoteTrackers();
      const existingIndex = trackers.findIndex(t => (t.id || '').toLowerCase() === userKey);

      const userObject = {
        id: userKey,
        user_name: userKey,
        movie_url,
        theaters,
        ntfy_topic,
        days_ahead,
        availability_filter,
        preferred_times,
        preferred_rows
      };

      if (existingIndex >= 0) {
        trackers[existingIndex] = userObject;
      } else {
        trackers.push(userObject);
      }

      const res = await fetch(CONFIG_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ trackers })
      });

      if (res.ok) {
        showStatus(`✓ Alert for '${userKey}' is active! Background scanner will now watch these seats.`);
      } else {
        showStatus('Failed to update remote storage.', true);
      }
    } catch (err) {
      showStatus(`Network Error: ${err.message}`, true);
    }
  }

  async function deleteUserTracker() {
    const userKey = document.getElementById('user_key').value.trim().toLowerCase();
    if (!userKey) return;

    showStatus('Removing alert...');
    try {
      let trackers = await fetchRemoteTrackers();
      trackers = trackers.filter(t => (t.id || '').toLowerCase() !== userKey);

      const res = await fetch(CONFIG_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ trackers })
      });

      if (res.ok) {
        document.getElementById('movie_url').value = '';
        document.getElementById('theaters').value = '';
        document.getElementById('ntfy_topic').value = '';
        showStatus(`Alert '${userKey}' removed.`);
      }
    } catch (err) {
      showStatus(`Error removing: ${err.message}`, true);
    }
  }
</script>
</body>
</html>
